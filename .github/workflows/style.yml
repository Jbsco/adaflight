name: Style

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  style:
    # The hosted-only steps below are gated on the runner environment, so
    # moving this job back to GitHub-hosted is the one-line change
    # `runs-on: ubuntu-latest`.
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Only a GitHub-hosted runner starts from a clean checkout.
          clean: ${{ runner.environment == 'github-hosted' }}

      - name: Cache Alire
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: |
            ~/.config/alire
            ~/.cache/alire
            ~/.local/share/alire
          key: alire-style-${{ runner.os }}-${{ hashFiles('core/alire.toml', 'tests/alire.toml') }}
          restore-keys: alire-style-${{ runner.os }}-

      - name: Install Alire
        if: runner.environment == 'github-hosted'
        uses: alire-project/setup-alire@v3
        with:
          version: 2.1.1

      - name: Install the markdown renderer
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y discount

      - name: Select GNAT toolchain
        if: runner.environment == 'github-hosted'
        run: |
          cd core
          alr -n toolchain --select gnat_native

      - name: Run style gate
        run: |
          set -o pipefail
          bash style.do 2>&1 | tee style-output.log
          grep -q "style: all checks clean" style-output.log
