name: SPARK Proofs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The self-hosted runners share one host, and two proof runs on it push the
# provers past their time limits, so the runs queue.
concurrency:
  group: spark-proofs
  cancel-in-progress: false

jobs:
  prove:
    # Self-hosted (terra): the host provides alr and the GNAT and gnatprove
    # toolchains natively; the hosted-only steps below are gated, so moving
    # this job back to GitHub-hosted is the one-line revert
    # `runs-on: ubuntu-latest`.
    runs-on: [self-hosted, linux]
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A self-hosted checkout keeps its Alire build between runs.
          clean: ${{ runner.environment == 'github-hosted' }}

      - name: Cache Alire
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: |
            ~/.config/alire
            ~/.cache/alire
            ~/.local/share/alire
          key: alire-prove-${{ runner.os }}-${{ hashFiles('core/alire.toml') }}
          restore-keys: alire-prove-${{ runner.os }}-

      - name: Install Alire
        if: runner.environment == 'github-hosted'
        uses: alire-project/setup-alire@v3
        with:
          version: 2.1.1

      - name: Select GNAT toolchain
        if: runner.environment == 'github-hosted'
        run: |
          cd core
          alr -n toolchain --select gnat_native

      - name: Fetch dependencies
        run: |
          cd core
          alr -n update
          alr -n build --stop-after=post-fetch || true
          alr -n exec -- gnatprove --version

      - name: Cache the proof session
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: core/obj/development/gnatprove
          key: proof-session-${{ runner.os }}-${{ github.sha }}
          restore-keys: proof-session-${{ runner.os }}-

      - name: Clear the proof session
        # A kept session replays a changed unit's goals with the step counts of
        # its old proofs as their limits, which fails checks a fresh session
        # proves at once.
        run: rm -rf core/obj/development/gnatprove

      - name: Run SPARK proofs
        env:
          PROVE_JOBS: 4
        run: |
          set -o pipefail
          bash prove.do 2>&1 | tee prove-output.log
          grep -q "core 100% proved" prove-output.log
          grep -q "(0 pragma Assume, 0 justified" prove-output.log
