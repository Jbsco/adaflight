name: SPARK Proofs

on:
  pull_request:
    branches: [main]
  schedule:
    # The whole core, nightly, at 03:00 Mountain time.
    - cron: '0 9 * * *'
  workflow_dispatch:

# A new push to a branch supersedes the proof run of its previous tip.
concurrency:
  group: spark-proofs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request proves the units it changed and the units that depend on a
  # changed specification; main is proven and the branch holds its tip, so the
  # rest is proven already. The nightly run proves the whole core. More than
  # eight units split into four jobs of about equal source size.
  plan:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.units.outputs.count }}
      groups: ${{ steps.units.outputs.groups }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The unit selection diffs against main, which needs the history.
          fetch-depth: 0

      - name: Select the units to prove
        id: units
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q origin main
            python3 tools/changed-units.py origin/main > units.txt
          else
            ls core/src/*.adb | xargs -n1 basename > units.txt
          fi
          echo "count=$(wc -l < units.txt)" >> "$GITHUB_OUTPUT"
          echo "groups=$(python3 tools/split-units.py units.txt 4)" >> "$GITHUB_OUTPUT"
          cat units.txt

  prove-group:
    name: prove group ${{ matrix.group }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Alire
        uses: actions/cache@v4
        with:
          path: |
            ~/.config/alire
            ~/.cache/alire
            ~/.local/share/alire
          key: alire-prove-${{ runner.os }}-${{ hashFiles('core/alire.toml') }}
          restore-keys: alire-prove-${{ runner.os }}-

      - name: Install Alire
        uses: alire-project/setup-alire@v3
        with:
          version: 2.1.1

      - name: Select GNAT toolchain
        run: |
          cd core
          alr -n toolchain --select gnat_native

      - name: Fetch dependencies
        run: |
          cd core
          alr -n update
          alr -n build --stop-after=post-fetch || true
          alr -n exec -- gnatprove --version

      # Every run proves from a fresh session. A kept session replays the
      # stored verdicts of an earlier run against the changed units.
      - name: Run SPARK proofs
        env:
          PROVE_JOBS: 4
          PROVE_SWITCHES: --timeout=900
          PROVE_UNITS: ${{ matrix.units }}
        run: |
          set -o pipefail
          bash prove.do 2>&1 | tee prove-output.log
          grep -q "core 100% proved" prove-output.log
          grep -q "(0 pragma Assume, 0 justified" prove-output.log

  # The check the branch rules require: every group proved, or no unit changed.
  prove:
    needs: [plan, prove-group]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gather the groups
        run: |
          [ "${{ needs.plan.result }}" = "success" ] || exit 1
          if [ "${{ needs.plan.outputs.count }}" = "0" ]; then
            echo "no core unit changed; the proof of main stands"
            exit 0
          fi
          [ "${{ needs.prove-group.result }}" = "success" ]
