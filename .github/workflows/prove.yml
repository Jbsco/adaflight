name: SPARK Proofs

on:
  pull_request:
    branches: [main]
  schedule:
    # The whole core, nightly, at 03:00 Mountain time.
    - cron: '0 9 * * *'
  workflow_dispatch:

# A new push to a branch supersedes the proof run of its previous tip.
concurrency:
  group: spark-proofs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request proves the units whose sources it changed.
  prove:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The unit selection diffs against main, which needs the history.
          fetch-depth: 0

      - name: Cache Alire
        uses: actions/cache@v4
        with:
          path: |
            ~/.config/alire
            ~/.cache/alire
            ~/.local/share/alire
          key: alire-prove-${{ runner.os }}-${{ hashFiles('core/alire.toml') }}
          restore-keys: alire-prove-${{ runner.os }}-

      - name: Install Alire
        uses: alire-project/setup-alire@v3
        with:
          version: 2.1.1

      - name: Select GNAT toolchain
        run: |
          cd core
          alr -n toolchain --select gnat_native

      - name: Fetch dependencies
        run: |
          cd core
          alr -n update
          alr -n build --stop-after=post-fetch || true
          alr -n exec -- gnatprove --version

      - name: Select the units to prove
        id: units
        run: |
          git fetch -q origin main
          python3 tools/changed-units.py origin/main > units.txt
          echo "count=$(wc -l < units.txt)" >> "$GITHUB_OUTPUT"
          cat units.txt

      # Every run proves from a fresh session. A kept session replays the
      # stored verdicts of an earlier run against the changed units.
      - name: Run SPARK proofs
        if: steps.units.outputs.count != '0'
        env:
          PROVE_JOBS: 4
          PROVE_SWITCHES: --timeout=900
        run: |
          set -o pipefail
          PROVE_UNITS="$(tr '\n' ' ' < units.txt)" bash prove.do 2>&1 | tee prove-output.log
          grep -q "core 100% proved" prove-output.log
          grep -q "(0 pragma Assume, 0 justified" prove-output.log

      - name: No unit changed
        if: steps.units.outputs.count == '0'
        run: echo "no core unit changed; the proof of main stands"

  # The nightly run proves every unit of the core, a generic unit through its
  # instantiations, in six shards of about equal source, each within an
  # eight hour limit; the shard that held the terminal and the menu contents
  # passed the six hour limit of four shards on 2026-10-25.
  prove-core:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Alire
        uses: actions/cache@v4
        with:
          path: |
            ~/.config/alire
            ~/.cache/alire
            ~/.local/share/alire
          key: alire-prove-${{ runner.os }}-${{ hashFiles('core/alire.toml') }}
          restore-keys: alire-prove-${{ runner.os }}-

      - name: Install Alire
        uses: alire-project/setup-alire@v3
        with:
          version: 2.1.1

      - name: Select GNAT toolchain
        run: |
          cd core
          alr -n toolchain --select gnat_native

      - name: Fetch dependencies
        run: |
          cd core
          alr -n update
          alr -n build --stop-after=post-fetch || true
          alr -n exec -- gnatprove --version

      - name: Select the shard's units
        run: |
          python3 tools/changed-units.py --all --shard ${{ matrix.shard }}/6 > units.txt
          cat units.txt

      - name: Run SPARK proofs
        env:
          PROVE_JOBS: 4
          PROVE_SWITCHES: --timeout=900
        run: |
          set -o pipefail
          PROVE_UNITS="$(tr '\n' ' ' < units.txt)" bash prove.do 2>&1 | tee prove-output.log
          grep -q "core 100% proved" prove-output.log
          grep -q "(0 pragma Assume, 0 justified" prove-output.log
