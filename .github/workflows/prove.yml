name: SPARK Proofs

on:
  pull_request:
    branches: [main]
  schedule:
    # The whole core, nightly, at 03:00 Mountain time.
    - cron: '0 9 * * *'
  workflow_dispatch:

# A new push to a branch supersedes the proof run of its previous tip.
concurrency:
  group: spark-proofs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request proves the units whose sources it changed and the units that
  # depend on a specification it changed, in as many shards as their source
  # needs for a shard to stay within one of the nightly run's.
  select:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.units.outputs.count }}
      shards: ${{ steps.units.outputs.shards }}
      list: ${{ steps.units.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The unit selection diffs against main, which needs the history.
          fetch-depth: 0

      - name: Select the units to prove
        id: units
        run: |
          git fetch -q origin main
          python3 tools/changed-units.py origin/main > units.txt
          shards="$(python3 tools/changed-units.py origin/main --shards)"
          echo "count=$(wc -l < units.txt)" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "list=[$(seq -s, 0 $((shards - 1)))]" >> "$GITHUB_OUTPUT"
          cat units.txt

  prove-units:
    needs: select
    if: needs.select.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.list) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Alire
        uses: actions/cache@v4
        with:
          path: |
            ~/.config/alire
            ~/.cache/alire
            ~/.local/share/alire
          key: alire-prove-${{ runner.os }}-${{ hashFiles('core/alire.toml') }}
          restore-keys: alire-prove-${{ runner.os }}-

      - name: Install Alire
        uses: alire-project/setup-alire@v3
        with:
          version: 2.1.1

      - name: Select GNAT toolchain
        run: |
          cd core
          alr -n toolchain --select gnat_native

      - name: Fetch dependencies
        run: |
          cd core
          alr -n update
          alr -n build --stop-after=post-fetch || true
          alr -n exec -- gnatprove --version

      - name: Select the shard's units
        run: |
          git fetch -q origin main
          python3 tools/changed-units.py origin/main --shard ${{ matrix.shard }}/${{ needs.select.outputs.shards }} > units.txt
          cat units.txt

      # Every run proves from a fresh session. A kept session replays the
      # stored verdicts of an earlier run against the changed units.
      - name: Run SPARK proofs
        env:
          PROVE_JOBS: 4
          PROVE_SWITCHES: --timeout=900
        run: |
          set -o pipefail
          # An empty unit list would prove the whole core.
          [ -s units.txt ]
          PROVE_UNITS="$(tr '\n' ' ' < units.txt)" bash prove.do 2>&1 | tee prove-output.log
          grep -q "core 100% proved" prove-output.log
          grep -q "(0 pragma Assume, 0 justified" prove-output.log

  # The check a pull request needs: every shard proved, or no core unit to
  # prove, and the tools' own proofs.
  prove:
    needs: [select, prove-units]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check the unit proofs
        run: |
          echo "select: ${{ needs.select.result }}, prove-units: ${{ needs.prove-units.result }}"
          [ "${{ needs.select.result }}" = success ]
          case "${{ needs.prove-units.result }}" in
            success) ;;
            skipped)
              [ "${{ needs.select.outputs.count }}" = 0 ] || exit 1
              echo "no core unit changed; the proof of main stands"
              ;;
            *) exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Alire
        uses: actions/cache@v4
        with:
          path: |
            ~/.config/alire
            ~/.cache/alire
            ~/.local/share/alire
          key: alire-prove-${{ runner.os }}-${{ hashFiles('core/alire.toml') }}
          restore-keys: alire-prove-${{ runner.os }}-

      - name: Install Alire
        uses: alire-project/setup-alire@v3
        with:
          version: 2.1.1

      - name: Select GNAT toolchain
        run: |
          cd core
          alr -n toolchain --select gnat_native

      - name: Fetch dependencies
        run: |
          cd core
          alr -n update
          alr -n build --stop-after=post-fetch || true
          alr -n exec -- gnatprove --version

      - name: Prove the DFU flasher
        run: |
          set -o pipefail
          cd tools/dfu
          alr -n build --stop-after=generation
          alr -n exec -- gnatprove -P adaflight_dfu.gpr -j4 --output=oneline 2>&1 | tee prove-output.log
          grep -q "all checks proved" prove-output.log
          ! grep -rn "pragma Assume" src

      - name: Prove the MSP client
        run: |
          set -o pipefail
          cd tools/msp
          alr -n build --stop-after=generation
          alr -n exec -- gnatprove -P adaflight_msp.gpr -j4 --output=oneline 2>&1 | tee prove-output.log
          grep -q "all checks proved" prove-output.log
          ! grep -rn "pragma Assume" src

  # The nightly run proves every unit of the core, a generic unit through its
  # instantiations, in six shards of about equal source, each within an
  # eight hour limit; the shard that held the terminal and the menu contents
  # passed the six hour limit of four shards on 2026-10-25.
  prove-core:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Alire
        uses: actions/cache@v4
        with:
          path: |
            ~/.config/alire
            ~/.cache/alire
            ~/.local/share/alire
          key: alire-prove-${{ runner.os }}-${{ hashFiles('core/alire.toml') }}
          restore-keys: alire-prove-${{ runner.os }}-

      - name: Install Alire
        uses: alire-project/setup-alire@v3
        with:
          version: 2.1.1

      - name: Select GNAT toolchain
        run: |
          cd core
          alr -n toolchain --select gnat_native

      - name: Fetch dependencies
        run: |
          cd core
          alr -n update
          alr -n build --stop-after=post-fetch || true
          alr -n exec -- gnatprove --version

      - name: Select the shard's units
        run: |
          python3 tools/changed-units.py --all --shard ${{ matrix.shard }}/6 > units.txt
          cat units.txt

      - name: Run SPARK proofs
        env:
          PROVE_JOBS: 4
          PROVE_SWITCHES: --timeout=900
        run: |
          set -o pipefail
          PROVE_UNITS="$(tr '\n' ' ' < units.txt)" bash prove.do 2>&1 | tee prove-output.log
          grep -q "core 100% proved" prove-output.log
          grep -q "(0 pragma Assume, 0 justified" prove-output.log
