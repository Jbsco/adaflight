name: Vector Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # Self-hosted (terra): the host provides alr and the GNAT and gnatprove
    # toolchains natively; the hosted-only steps below are gated, so moving
    # this job back to GitHub-hosted is the one-line revert
    # `runs-on: ubuntu-latest`.
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A self-hosted checkout keeps its build and proof session between
          # runs, so the proofs re-run only the changed units.
          clean: ${{ runner.environment == 'github-hosted' }}

      - name: Cache Alire
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: |
            ~/.config/alire
            ~/.cache/alire
            ~/.local/share/alire
          key: alire-test-${{ runner.os }}-${{ hashFiles('core/alire.toml', 'tests/alire.toml') }}
          restore-keys: alire-test-${{ runner.os }}-

      - name: Install Alire
        if: runner.environment == 'github-hosted'
        uses: alire-project/setup-alire@v3
        with:
          version: 2.1.1

      - name: Select GNAT toolchain
        if: runner.environment == 'github-hosted'
        run: |
          cd tests
          alr -n toolchain --select gnat_native

      - name: Run vector checks
        run: |
          set -o pipefail
          bash test.do 2>&1 | tee test-output.log
          grep -q "all cases within tolerance" test-output.log
