name: Target Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  target:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache Alire
        uses: actions/cache@v4
        with:
          path: |
            ~/.config/alire
            ~/.cache/alire
            ~/.local/share/alire
          key: alire-target-${{ runner.os }}-${{ hashFiles('targets/stm32f4/alire.toml', 'targets/host/alire.toml', 'core/alire.toml') }}
          restore-keys: alire-target-${{ runner.os }}-

      - name: Install Alire
        uses: alire-project/setup-alire@v3
        with:
          version: 2.1.1

      - name: Build the STM32F4 image
        run: bash target.do

      - name: Select the native GNAT toolchain
        run: |
          cd targets/host
          alr -n toolchain --select gnat_native

      - name: Build and check the host image
        run: bash host.do

      - name: Keep the image
        uses: actions/upload-artifact@v4
        with:
          name: adaflight-stm32f4-clracingf4
          path: |
            targets/stm32f4/bin/adaflight_stm32f4
            targets/stm32f4/obj/adaflight_stm32f4.map
          retention-days: 14

      - name: Build the 512 KB feature set
        run: FLASH_KB=512 bash target.do

      - name: Build the LUXF4OSD image
        run: BOARD=LUXF4OSD bash target.do

      - name: Build the OMNIBUSF4 image
        run: BOARD=OMNIBUSF4 bash target.do

      - name: Build the STM32F7 image for the KAKUTEF7
        run: CRATE=stm32f7 BOARD=KAKUTEF7 bash target.do
